spring:
  datasource:
    url: jdbc:h2:mem:encostaseguratest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;INIT=CREATE ALIAS IF NOT EXISTS ST_CONTAINS FOR 'br.com.encostasegura.shared.config.H2SpatialFunctions.stContains'
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

logging:
  level:
    br.com.encostasegura: DEBUG
    org.springframework: WARN
